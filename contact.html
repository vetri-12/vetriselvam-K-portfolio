<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact - Vetriselvam K</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body style="background: linear-gradient(to top right, #F8F4E3, #ffffff);" class="text-black font-sans min-h-screen flex flex-col">

  <!-- Global Header -->
  <header style="background-color: #0047AB;" class="shadow p-5 fixed w-full top-0 z-50">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <a href="index.html" class="text-white font-bold text-xl tracking-wide">VK.</a>
      <nav class="space-x-4 md:space-x-6">
        
        <a href="about.html" class="text-white font-semibold relative group pb-1 transition-colors hover:text-[#F8F4E3]">
          About
          <span class="absolute left-0 bottom-0 w-0 h-0.5 bg-[#F8F4E3] transition-all duration-300 group-hover:w-full"></span>
        </a>
        <a href="skills.html" class="text-white font-semibold relative group pb-1 transition-colors hover:text-[#F8F4E3]">
          Skills
          <span class="absolute left-0 bottom-0 w-0 h-0.5 bg-[#F8F4E3] transition-all duration-300 group-hover:w-full"></span>
        </a>
        <a href="projects.html" class="text-white font-semibold relative group pb-1 transition-colors hover:text-[#F8F4E3]">
          Projects
          <span class="absolute left-0 bottom-0 w-0 h-0.5 bg-[#F8F4E3] transition-all duration-300 group-hover:w-full"></span>
        </a>
        
        <!-- Active Page -->
        <a href="contact.html" class="text-white font-bold relative pb-1">
          Contact
          <span class="absolute left-0 bottom-0 w-full h-0.5 bg-[#F8F4E3]"></span>
        </a>
        
      </nav>
    </div>
  </header>

  <!-- Contact Section -->
  <main class="flex-grow pt-32 pb-16 flex flex-col items-center px-6">
    
    <h1 class="text-4xl font-bold text-center" style="color:#0047AB;">Let's Connect</h1>
    <p class="text-center text-black/80 mt-2 mb-8 text-lg">Have a project in mind or want to collaborate? Reach out!</p>
    
    <div style="background-color:#ffffff;" class="p-8 rounded-2xl shadow-xl max-w-lg w-full border border-black/5">
      <form
        action="https://formsubmit.co/5fb34f7b5096b21bb26cae48ad889ff8"
        method="POST"
        class="space-y-6"
        autocomplete="off"
      >
        <input type="hidden" name="_next" value="https://vetri-12.github.io/vetriselvam-K-portfolio/thankyou.html" />
        <input type="hidden" name="_captcha" value="false" />

        <div>
          <label for="name" class="block mb-1 font-medium text-black">Your Name</label>
          <input
            type="text"
            id="name"
            name="name"
            required
            class="w-full border border-black/20 p-3 rounded-lg focus:outline-none focus:border-[#0047AB]"
          />
        </div>

        <div>
          <label for="email" class="block mb-1 font-medium text-black">Your Email</label>
          <input
            type="email"
            id="email"
            name="email"
            required
            class="w-full border border-black/20 p-3 rounded-lg focus:outline-none focus:border-[#0047AB]"
          />
        </div>

        <div>
          <label for="message" class="block mb-1 font-medium text-black">Your Message</label>
          <textarea
            id="message"
            name="message"
            rows="5"
            required
            class="w-full border border-black/20 p-3 rounded-lg focus:outline-none focus:border-[#0047AB]"
          ></textarea>
        </div>

        <button
          type="submit"
          style="background-color: #0047AB;"
          class="w-full text-[#F8F4E3] p-3 rounded-lg hover:bg-blue-900 transition duration-300 font-semibold shadow-md"
        >
          Send Message
        </button>
      </form>
    </div>
  </main>

  <!-- Footer -->
  <footer class="text-center py-6 text-black/60 text-sm">
    © 2026 Vetriselvam K | Let's build the future together
  </footer>
</body>
</html>
